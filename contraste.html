<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contraste simultâneo — experimento interativo</title>
    <style>
        :root {
            color-scheme: light;
            --centro: #e76f59;
            --fundo1: #239a70;
            --fundo2: #3565bd;
            --tam: 36%;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f5f5f3;
            color: #202326
        }

        .wrap {
            width: min(1050px, 94vw);
            margin: 32px auto
        }

        h1 {
            font-size: clamp(1.3rem, 3vw, 2rem);
            margin: 0 0 8px
        }

        p {
            color: #555;
            line-height: 1.5;
            margin: 0 0 24px
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: end;
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px #0000000b
        }

        .control {
            display: grid;
            gap: 7px;
            min-width: 135px;
            flex: 1
        }

        .control label {
            font-size: .87rem;
            font-weight: 600
        }

        input[type=color] {
            width: 100%;
            height: 44px;
            padding: 3px;
            border: 1px solid #bbb;
            border-radius: 9px;
            background: white;
            cursor: pointer
        }

        input[type=range] {
            width: 100%;
            accent-color: #303c50
        }

        .value {
            font-size: .82rem;
            color: #555
        }

        button {
            border: 1px solid #ccc;
            border-radius: 9px;
            background: #f6f6f6;
            padding: 13px 17px;
            cursor: pointer;
            font-weight: 600
        }

        button:hover {
            background: #eaeaea
        }

        .panels {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px
        }

        .panel {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px #0000000b
        }

        .sample {
            aspect-ratio: 1.25;
            display: grid;
            place-items: center
        }

        .sample.a {
            background: var(--fundo1)
        }

        .sample.b {
            background: var(--fundo2)
        }

        .center {
            background: var(--centro);
            width: var(--tam);
            aspect-ratio: 1;
            flex: none
        }

        .caption {
            padding: 12px 16px;
            font-size: .9rem;
            font-weight: 600;
            text-align: center
        }

        .note {
            margin-top: 18px;
            font-size: .9rem;
            color: #555
        }

        .swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            vertical-align: -1px;
            background: var(--centro);
            border: 1px solid #999;
            margin-right: 5px
        }

        @media(max-width:650px) {
            .wrap {
                margin: 16px auto
            }

            .panels {
                gap: 12px
            }

            .sample {
                aspect-ratio: 1
            }

            .controls {
                gap: 12px
            }

            .control {
                min-width: calc(50% - 8px)
            }

            .caption {
                font-size: .78rem;
                padding: 10px 4px
            }
        }

        @media(max-width:420px) {
            .panels {
                grid-template-columns: 1fr
            }

            .sample {
                aspect-ratio: 1.45
            }

            .control {
                min-width: 100%
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <h1>Contraste simultâneo das cores</h1>
        <p>Compare dois quadrados centrais idênticos em fundos diferentes. Altere as cores e o tamanho para observar a
            influência do entorno na percepção.</p>
        <section class="controls" aria-label="Controles">
            <div class="control"><label for="centro">Cor dos quadrados centrais</label><input id="centro" type="color"
                    value="#e76f59"></div>
            <div class="control"><label for="fundo1">Fundo esquerdo</label><input id="fundo1" type="color"
                    value="#239a70"></div>
            <div class="control"><label for="fundo2">Fundo direito</label><input id="fundo2" type="color"
                    value="#3565bd"></div>
            <div class="control"><label for="tamanho">Tamanho dos quadrados</label><input id="tamanho" type="range"
                    min="10" max="75" value="36"><span class="value" id="valor">36%</span></div><button id="reset"
                type="button">Restaurar</button>
        </section>
        <section class="panels" aria-label="Comparação de contraste">
            <div class="panel">
                <div class="sample a">
                    <div class="center"></div>
                </div>
                <div class="caption">Fundo 1</div>
            </div>
            <div class="panel">
                <div class="sample b">
                    <div class="center"></div>
                </div>
                <div class="caption">Fundo 2</div>
            </div>
        </section>
        <p class="note"><span class="swatch"></span>Os dois quadrados centrais têm sempre exatamente o mesmo valor RGB.
            Apenas os fundos são diferentes.</p>
    </main>
    <script>
        const root = document.documentElement; const ids = ['centro', 'fundo1', 'fundo2']; const defaults = { centro: '#e76f59', fundo1: '#239a70', fundo2: '#3565bd', tamanho: '36' };
        function update() { ids.forEach(id => root.style.setProperty('--' + id, document.getElementById(id).value)); const n = document.getElementById('tamanho').value; root.style.setProperty('--tam', n + '%'); document.getElementById('valor').textContent = n + '%' }
        [...ids, 'tamanho'].forEach(id => document.getElementById(id).addEventListener('input', update)); document.getElementById('reset').addEventListener('click', () => { Object.entries(defaults).forEach(([id, v]) => document.getElementById(id).value = v); update() }); update();
    </script>
</body>

</html>
